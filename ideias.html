/*menu*/
.menu-container {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.item-pai {
    position: relative;
    display: inline-block;
}

.sub-menu {
    display: none;
    position: absolute;
    top: 100%; 
    left: 0;
    background-color: #cacaca; 
    min-width: 160px;
    box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
    z-index: 1000;
    padding: 10px 0;
    border: 1px solid #aeaeae;
}

.sub-menu a {
    color: #07044f;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    font-size: 14px;
    border-bottom: 1px solid #dcdcdc;
}

.sub-menu a:hover {
    background-color: #dcdcdc;
}

.item-pai:hover .sub-menu {
    display: block;
}
/* ÁREA DOS CARDS */

.cards-container{
    display: flex;

.cards img{

    border-radius: 10px;
}

/* GALERIA */

.galeria{
